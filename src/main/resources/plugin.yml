name: NexusGate
version: 0.1.0
main: com.nexuscraft.nexusgate.NexusGate
api-version: '1.21'
author: RealSociety
description: Requires the server's current password to be typed in before a Java player can play, independent of whitelist/ban.
softdepend: [floodgate]

commands:
  login:
    description: Authenticate with the server password.
    usage: /login <password>
  nexusgate:
    description: Manage NexusGate's password and settings.
    usage: /nexusgate <setpassword|reload|status> [args]
    permission: nexusgate.admin

permissions:
  nexusgate.admin:
    description: Set/change the server password and manage NexusGate.
    default: op
  nexusgate.bypass:
    description: Players who always skip the password gate entirely.
    default: false
