name: NexusGate
version: 0.5.0
main: com.nexuscraft.nexusgate.NexusGate
api-version: '1.21'
author: RealSociety
description: Requires the server's current password to be typed in before a player can play -- separate passwords for Java and Bedrock/Xbox -- independent of whitelist/ban.
softdepend: [floodgate]

commands:
  login:
    description: Authenticate with the server password.
    usage: /login <password>
  nexusgate:
    description: Manage NexusGate's passwords, access log, bans, and IP bans.
    usage: /nexusgate <setpassword [java|bedrock] <password>|reload|status|ban <player> [reason]|unban <player>|banlist|knownusers|banip <ip> [reason]|unbanip <ip>|ipbanlist|altcheck <player>>
    permission: nexusgate.admin

permissions:
  nexusgate.admin:
    description: Set/change the server password and manage NexusGate.
    default: op
  nexusgate.bypass:
    description: Players who always skip the password gate entirely.
    default: false
  nexusgate.watch:
    description: Receive live in-game alerts for ban-evasion matches and first-time logins.
    default: op
